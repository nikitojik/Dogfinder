name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Run pre-commit hooks
        run: uvx pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://dogfinder:dogfinder@localhost:5432/dogfinder_test
      SECRET_KEY: ci-secret-key-not-for-production
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci
      NOTIFICATIONS_ENABLED: "false"
      ML_LAZY_LOAD: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Build Postgres image
        run: docker build -t dogfinder-db docker/postgres

      - name: Start Postgres
        run: |
          docker run -d --name db -p 5432:5432 \
            -e POSTGRES_USER=dogfinder \
            -e POSTGRES_PASSWORD=dogfinder \
            -e POSTGRES_DB=dogfinder_test \
            dogfinder-db

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker exec db pg_isready -U dogfinder -h 127.0.0.1; then
              exit 0
            fi
            sleep 1
          done
          echo "Postgres did not start"
          docker logs db
          exit 1

      - name: Run tests
        run: uv run --frozen pytest -v
