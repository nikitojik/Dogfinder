{% extends "base.html" %}
{% block title %}{{ _("Listings") }} — DogFinder{% endblock %}

{% block content %}
<div class="feed-page">
    <h1>{{ _("Listings") }}</h1>

    <form id="filters" class="filters">
        <div class="filter-tabs">
            <label><input type="radio" name="kind" value="" checked><span>{{ _("All") }}</span></label>
            <label><input type="radio" name="kind" value="lost"><span>{{ _("Lost") }}</span></label>
            <label><input type="radio" name="kind" value="found"><span>{{ _("Found") }}</span></label>
        </div>

        <div class="filter-row">
            <label>
                {{ _("Breed") }}
                <input type="text" name="breed" placeholder="{{ _('Any') }}">
            </label>
            <label>
                {{ _("Size") }}
                <select name="size">
                    <option value="">{{ _("Any") }}</option>
                    <option value="small">{{ _("Small") }}</option>
                    <option value="medium">{{ _("Medium") }}</option>
                    <option value="large">{{ _("Large") }}</option>
                </select>
            </label>
            <label>
                {{ _("Not earlier than") }}
                <input type="date" name="since">
            </label>
        </div>
    </form>

    <div id="feed-list" class="feed-list">
        <p class="loading">{{ _("Loading…") }}</p>
    </div>

    <div id="feed-more" class="feed-more" hidden>
        <button type="button" id="load-more">{{ _("Show more") }}</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/feed.js"></script>
{% endblock %}
