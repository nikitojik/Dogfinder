{% extends "base.html" %}
{% block title %}Объявления — DogFinder{% endblock %}

{% block content %}
<div class="feed-page">
    <h1>Объявления</h1>

    <form id="filters" class="filters">
        <div class="filter-tabs">
            <label><input type="radio" name="kind" value="" checked><span>Все</span></label>
            <label><input type="radio" name="kind" value="lost"><span>Пропали</span></label>
            <label><input type="radio" name="kind" value="found"><span>Найдены</span></label>
        </div>

        <div class="filter-row">
            <label>
                Порода
                <input type="text" name="breed" placeholder="Любая">
            </label>
            <label>
                Размер
                <select name="size">
                    <option value="">Любой</option>
                    <option value="small">Мелкая</option>
                    <option value="medium">Средняя</option>
                    <option value="large">Крупная</option>
                </select>
            </label>
            <label>
                Не раньше
                <input type="date" name="since">
            </label>
        </div>
    </form>

    <div id="feed-list" class="feed-list">
        <p class="loading">Загружаем…</p>
    </div>

    <div id="feed-more" class="feed-more" hidden>
        <button type="button" id="load-more">Показать ещё</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/feed.js"></script>
{% endblock %}
