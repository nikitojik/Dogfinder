{% extends "base.html" %}
{% block title %}{{ _("Log in") }} — DogFinder{% endblock %}

{% block content %}
<div class="form-page">
    <h1>{{ _("Log in") }}</h1>
    <form id="login-form">
        <label>
            {{ _("Email") }}
            <input type="email" name="email" required>
        </label>
        <label>
            {{ _("Password") }}
            <input type="password" name="password" required minlength="8">
        </label>
        <p class="error" id="error"></p>
        <button type="submit">{{ _("Log in") }}</button>
    </form>
    <p class="hint">{{ _("No account yet?") }} <a href="/register">{{ _("Sign up") }}</a></p>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/auth.js"></script>
{% endblock %}
