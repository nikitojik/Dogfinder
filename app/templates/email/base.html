<!DOCTYPE html>
<html lang="{{ locale }}">
<head><meta charset="UTF-8"></head>
<body style="margin:0;padding:24px;background:#f5f5f5;font-family:Arial,sans-serif;color:#1a1a1a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr><td align="center">
            <table role="presentation" width="100%" style="max-width:520px;background:#ffffff;border-radius:8px;padding:28px;" cellpadding="0" cellspacing="0">
                <tr><td>
                    <div style="font-weight:bold;font-size:18px;margin-bottom:20px;">DogFinder</div>
                    {% block content %}{% endblock %}
                    <div style="margin-top:28px;padding-top:16px;border-top:1px solid #e0e0e0;font-size:12px;color:#888;">
                        {{ _("This is an automated message, no reply is needed.") }}
                    </div>
                </td></tr>
            </table>
        </td></tr>
    </table>
</body>
</html>
